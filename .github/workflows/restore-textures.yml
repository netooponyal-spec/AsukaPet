
name: Restore Rem Textures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Download original GLB
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/netooponyal-spec/AsukaPet/releases/download/Ram/rem.glb" \
            -o rem.glb

      - name: Restore texture and remove background
        run: |
          npm init -y
          npm install @gltf-transform/core

          cat > restore.mjs <<'EOF'
          import fs from 'node:fs';
          import { NodeIO } from '@gltf-transform/core';

          const io = new NodeIO();
          const doc = await io.read('rem.glb');
          const root = doc.getRoot();

          const texturePath = 'Rem_ALBShadowAlt.png';

          if (!fs.existsSync(texturePath)) {
            throw new Error(`Texture file not found: ${texturePath}`);
          }

          const image = fs.readFileSync(texturePath);

          const texture = doc.createTexture('Rem_ALBShadowAlt')
            .setImage(image)
            .setMimeType('image/png');

          const material = root.listMaterials().find(
            m => m.getName().toLowerCase() === 'm_rem'
          );

          if (!material) {
            throw new Error('Material M_Rem was not found.');
          }

          material
            .setBaseColorTexture(texture)
            .setBaseColorFactor([1, 1, 1, 1]);

          console.log('Texture attached to:', material.getName());

          let removed = 0;

          for (const node of [...root.listNodes()]) {
            if (/^Bg\b/i.test(node.getName().trim())) {
              console.log('Removing background node:', node.getName());
              node.dispose();
              removed++;
            }
          }

          console.log('Background nodes removed:', removed);

          const scenes = root.listScenes();

          for (const scene of scenes) {
            const nodes = scene.listChildren();
            console.log(
              'Scene:',
              scene.getName(),
              '| root nodes:',
              nodes.length
            );
          }

          await io.write('rem-textured.glb', doc);
          console.log('Created rem-textured.glb');
          EOF

          node restore.mjs

      - name: Inspect output model
        run: |
          npx --yes @gltf-transform/cli inspect rem-textured.glb

      - name: Upload textured model
        uses: actions/upload-artifact@v4
        with:
          name: rem-textured
          path: rem-textured.glb
          compression-level: 0
