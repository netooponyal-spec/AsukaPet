```yaml
name: Restore Rem Textures

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Download original GLB
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/netooponyal-spec/AsukaPet/releases/download/Ram/rem.glb" \
            -o rem.glb

      - name: Restore texture and remove background
        run: |
          npm init -y
          npm install @gltf-transform/core

          cat > restore.mjs <<'EOF'
          import fs from 'node:fs';
          import { NodeIO } from '@gltf-transform/core';

          const io = new NodeIO();
          const doc = await io.read('rem.glb');
          const root = doc.getRoot();

          const texturePath = 'Rem_ALBShadowAlt.png';

          if (!fs.existsSync(texturePath)) {
            throw new Error(`Texture file not found: ${texturePath}`);
          }

          const texture = doc.createTexture('Rem_ALBShadowAlt')
            .setImage(fs.readFileSync(texturePath))
            .setMimeType('image/png');

          const material = root.listMaterials().find(
            m => m.getName().toLowerCase() === 'm_rem'
          );

          if (!material) {
            throw new Error('Material M_Rem was not found.');
          }

          material
            .setBaseColorTexture(texture)
            .setBaseColorFactor([1, 1, 1, 1]);

          for (const node of [...root.listNodes()]) {
            if (/^Bg\b/i.test(node.getName().trim())) {
              node.dispose();
            }
          }

          await io.write('rem-textured.glb', doc);
          EOF

          node restore.mjs
          mkdir -p public/models
          cp rem-textured.glb public/models/rem-textured.glb
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
