
name: Inspect Rem Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download original model
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/netooponyal-spec/AsukaPet/releases/download/Ram/rem.glb" \
            -o rem-original.glb

      - name: Inspect original model
        run: |
          npx --yes @gltf-transform/cli inspect rem-original.glb \
            > report.txt
          cat report.txt

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: rem-report
          path: report.txt
