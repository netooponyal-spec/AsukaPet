
name: Optimize GLB v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Download original model
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/netooponyal-spec/AsukaPet/releases/download/Ram/rem.glb" \
            -o rem-original.glb

      - name: Check original file
        run: |
          ls -lh rem-original.glb
          file rem-original.glb

      - name: Optimize model
        run: |
          npx --yes @gltf-transform/cli optimize \
            rem-original.glb rem-v2.glb

      - name: Verify output
        run: |
          ls -lh rem-original.glb rem-v2.glb
          npx --yes @gltf-transform/cli inspect rem-v2.glb

      - name: Upload new model
        uses: actions/upload-artifact@v4
        with:
          name: rem-v2
          path: rem-v2.glb
          if-no-files-found: error
          compression-level: 0
          
