
name: Optimize GLB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Download model
        run: |
          curl -L --fail \
            "https://github.com/netooponyal-spec/AsukaPet/releases/download/Ram/rem.glb" \
            -o rem.glb

      - name: Optimize model safely
        run: |
          npx --yes @gltf-transform/cli optimize \
            rem.glb rem-optimized.glb

      - name: Check output
        run: |
          ls -lh rem.glb rem-optimized.glb
          npx --yes @gltf-transform/cli inspect rem-optimized.glb

      - name: Upload optimized model
        uses: actions/upload-artifact@v4
        with:
          name: rem-optimized
          path: rem-optimized.glb
