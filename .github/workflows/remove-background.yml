
name: Remove Rem Background

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-background:
    runs-on: ubuntu-latest

    steps:
      - name: Download textured model
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/netooponyal-spec/AsukaPet/releases/download/Rem-textured1/rem-textured.glb" \
            -o rem-textured.glb

      - name: Remove background meshes
        run: |
          npm init -y
          npm install @gltf-transform/core

          cat > remove-background.mjs <<'EOF'
          import { NodeIO } from '@gltf-transform/core';

          const io = new NodeIO();
          const doc = await io.read('rem-textured.glb');
          const root = doc.getRoot();

          let removed = 0;

          for (const node of [...root.listNodes()]) {
            const mesh = node.getMesh();
            if (!mesh) continue;

            const name = `${node.getName()} ${mesh.getName()}`.toLowerCase();

            if (name.includes('bg ') || name.startsWith('bg')) {
              console.log('Removing background:', node.getName(), mesh.getName());
              node.setMesh(null);
              removed++;
            }
          }

          console.log(`Background meshes detached: ${removed}`);

          await io.write('rem-no-background.glb', doc);
          console.log('Saved rem-no-background.glb');
          EOF

          node remove-background.mjs

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: rem-no-background
          path: rem-no-background.glb
          compression-level: 0
          
