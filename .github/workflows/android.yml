
name: Build Asuka Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AsukaPet-Android-AI-Starter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android source
        run: unzip -q AsukaPet-Android-AI-Starter.zip -d source
      - name: Fix Java and Kotlin JVM targets
        run: |
          FILE=$(find source -path '*/app/build.gradle.kts' -print -quit)
          if [ -z "$FILE" ]; then
            echo "Cannot find app/build.gradle.kts"
            find source -maxdepth 4 -type f | head -80
            exit 1
          fi
          sed -i '/compileOptions[[:space:]]*{/,$d' "$FILE"
          sed -i '/android[[:space:]]*{/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' "$FILE"
          echo "Updated $FILE"
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/AsukaDesktopPet
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsukaPet-debug-APK
          path: source/AsukaDesktopPet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
