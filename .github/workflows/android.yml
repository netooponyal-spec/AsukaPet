
name: Build Asuka Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AsukaPet-Animations-Starter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract animated Android source
        run: unzip -q AsukaPet-Animations-Starter.zip -d source

      - name: Find Android project
        run: |
          echo "ZIP contents:"
          find source -maxdepth 4 -type f | head -100
          FILE=$(find source -path '*/app/build.gradle.kts' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found in animation ZIP"
            exit 1
          fi
          echo "Found Gradle file: $FILE"
          echo "PROJECT_DIR=$(dirname "$(dirname "$FILE")")" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin JVM targets
        run: |
          FILE=$(find source -path '*/app/build.gradle.kts' -print -quit)
          sed -i '/compileOptions[[:space:]]*{/,$d' "$FILE"
          sed -i '/android[[:space:]]*{/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' "$FILE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsukaPet-Animated-debug-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
