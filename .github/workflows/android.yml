
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AsukaPet-Android-AI-Starter.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p android-app
          unzip -o AsukaPet-Android-AI-Starter.zip -d android-app

      - name: Find project directory
        shell: bash
        run: |
          SETTINGS_FILE=$(find android-app -maxdepth 8 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download Rem model
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          curl -fL --retry 3 \
            "https://github.com/netooponyal-spec/AsukaPet/releases/download/Rem-textured1/rem-textured.glb" \
            -o "$PROJECT_DIR/app/src/main/assets/rem-textured.glb"
          test -s "$PROJECT_DIR/app/src/main/assets/rem-textured.glb"

      - name: Configure SceneView and JVM
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle.kts"
          text = gradle_file.read_text()

          if 'io.github.sceneview:sceneview:2.3.0' not in text:
              text += '''

          dependencies {
              implementation("io.github.sceneview:sceneview:2.3.0")
          }
          '''

          text = re.sub(
              r'(?m)^[ \t]*compileOptions\s*\{[^{}]*\}[ \t]*\n?',
              '',
              text
          )
          text = re.sub(
              r'(?m)^[ \t]*kotlinOptions\s*\{[^{}]*\}[ \t]*\n?',
              '',
              text
          )

          match = re.search(r'\bandroid\s*\{', text)
          if not match:
              raise SystemExit("android block not found")

          text = (
              text[:match.end()]
              + '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          '''
              + text[match.end():]
          )

          text += '''

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
              }
          }
          '''

          gradle_file.write_text(text)

          manifest = project / "app/src/main/AndroidManifest.xml"
          if manifest.exists():
              xml = manifest.read_text()
              xml = xml.replace('android:label="Asuka Pet"', 'android:label="Rem Pet"')
              manifest.write_text(xml)

          main = project / "app/src/main/java/com/example/asukapet/MainActivity.kt"
          if main.exists():
              src = main.read_text()
              src = src.replace("Аска — экранный ассистент", "Рем — экранный ассистент")
              src = src.replace("Включить Аску", "Включить Рем")
              src = src.replace("Убрать Аску", "Убрать Рем")
              src = src.replace("enableAsuka", "enableRem")
              src = src.replace("Аска появилась на экране", "Рем появилась на экране")
              main.write_text(src)

          print("SceneView dependency, JVM 1.8 and Rem label configured")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/outputs/apk/debug/app-debug.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::APK file was not produced"
            exit 1
          fi
          cp "$APK" Rem-Android-APK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rem-Android-APK
          path: Rem-Android-APK.apk
          if-no-files-found: error
