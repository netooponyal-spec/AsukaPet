
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка 3D-модели Аски</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #171717;
      color: white;
      font-family: sans-serif;
    }

    h2 { font-size: 22px; }

    #status {
      overflow-wrap: anywhere;
      line-height: 1.5;
      color: #b9e5ff;
    }

    #view {
      width: 100%;
      height: 68vh;
      display: block;
      border-radius: 12px;
      background: #292929;
    }
  </style>
</head>
<body>
  <h2>Проверка 3D-модели Аски</h2>
  <p id="status">Запуск...</p>
  <canvas id="view"></canvas>

  <script type="module">
    const status = document.getElementById('status');
    const canvas = document.getElementById('view');

    const url =
      'https://github.com/netooponyal-spec/AsukaPet/releases/download/Asuka-model-v1/ip-evangelion__asuka-langley__concept__tpose.glb';

    function showError(message) {
      status.textContent = 'Ошибка: ' + message;
      console.error(message);
    }

    try {
      status.textContent = 'Подключаем Three.js...';

      const THREE = await import(
        'https://esm.sh/three@0.170.0'
      );

      const { GLTFLoader } = await import(
        'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js'
      );

      status.textContent = 'Проверяем WebGL...';

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true
      });

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
      );

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x292929);

      const camera = new THREE.PerspectiveCamera(
        35, 1, 0.01, 10000
      );

      scene.add(
        new THREE.HemisphereLight(
          0xffffff, 0x555566, 2.2
        )
      );

      const light = new THREE.DirectionalLight(
        0xffffff, 3
      );
      light.position.set(4, 8, 6);
      scene.add(light);

      function resize() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;

        if (!w || !h) return;

        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }

      window.addEventListener('resize', resize);
      resize();

      status.textContent = 'Загружаем модель Аски...';

      const loader = new GLTFLoader();

      loader.load(
        url,
        (gltf) => {
          const model = gltf.scene;
          scene.add(model);

          const bounds = new THREE.Box3()
            .setFromObject(model);

          const size = bounds.getSize(
            new THREE.Vector3()
          );

          const center = bounds.getCenter(
            new THREE.Vector3()
          );

          if (
            !Number.isFinite(size.x) ||
            !Number.isFinite(size.y) ||
            !Number.isFinite(size.z) ||
            Math.max(size.x, size.y, size.z) === 0
          ) {
            showError('Модель пустая или имеет неверные размеры.');
            return;
          }

          model.position.sub(center);

          const maxDim = Math.max(
            size.x, size.y, size.z
          );

          const fov = THREE.MathUtils.degToRad(
            camera.fov
          );

          const distance =
            (maxDim / 2) / Math.tan(fov / 2) * 1.35;

          camera.position.set(
            0, 0, distance
          );

          camera.near = Math.max(
            maxDim / 1000, 0.001
          );

          camera.far = maxDim * 100;
          camera.lookAt(0, 0, 0);
          camera.updateProjectionMatrix();

          status.textContent =
            'Аска загружена! Размер модели: ' +
            size.x.toFixed(2) + ' × ' +
            size.y.toFixed(2) + ' × ' +
            size.z.toFixed(2);

          console.log('Модель загружена:', gltf);
        },
        (event) => {
          if (event.total > 0) {
            status.textContent =
              'Загрузка модели: ' +
              Math.round(
                event.loaded / event.total * 100
              ) + '%';
          } else {
            status.textContent =
              'Загружаем модель: ' +
              (event.loaded / 1048576).toFixed(1) +
              ' МБ получено';
          }
        },
        (error) => {
          console.error(
            'GLTFLoader error:', error
          );

          showError(
            'GLTFLoader не смог прочитать модель. ' +
            'Проверь консоль браузера: возможны CORS, ' +
            'сетевая ошибка или некорректный GLB. ' +
            'Подробности: ' +
            (error?.message || String(error))
          );
        }
      );

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      animate();

    } catch (error) {
      console.error('Ошибка запуска:', error);

      showError(
        (error?.message || String(error)) +
        '. Проверь подключение к интернету и поддержку WebGL.'
      );
    }
  </script>
</body>
</html>
