<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аска — 3D тест</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #171717;
      color: white;
      font-family: sans-serif;
    }

    h2 {
      margin-top: 0;
    }

    #status {
      line-height: 1.5;
      overflow-wrap: anywhere;
      color: #b9e5ff;
    }

    #view {
      width: 100%;
      height: 70vh;
      display: block;
      background: #292929;
      border-radius: 12px;
      touch-action: none;
    }

    #controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 15px;
    }

    button:active {
      background: #555;
    }
  </style>
</head>

<body>

  <h2>Аска — 3D тест</h2>

  <p id="status">
    Запуск...
  </p>

  <canvas id="view"></canvas>

  <div id="controls">
    <button id="play">▶ Анимация</button>
    <button id="stop">■ Стоп</button>
    <button id="reset">↻ Сброс</button>
  </div>

  <script type="module">

    const status =
      document.getElementById('status');

    const canvas =
      document.getElementById('view');

    const playButton =
      document.getElementById('play');

    const stopButton =
      document.getElementById('stop');

    const resetButton =
      document.getElementById('reset');


    // =====================================================
    // МОДЕЛЬ АСКИ
    // =====================================================

    const url =
      'https://huggingface.co/An9er/asuka-model/resolve/main/ip-evangelion__asuka-langley__concept__tpose%20(3).glb?download=true';


    // =====================================================
    // THREE.JS
    // =====================================================

    try {

      status.textContent =
        'Подключаем 3D-движок...';

      const THREE = await import(
        'https://esm.sh/three@0.170.0'
      );

      const { GLTFLoader } = await import(
        'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js'
      );


      // ===================================================
      // СЦЕНА
      // ===================================================

      const scene =
        new THREE.Scene();

      scene.background =
        new THREE.Color(0x292929);


      // ===================================================
      // КАМЕРА
      // ===================================================

      const camera =
        new THREE.PerspectiveCamera(
          35,
          1,
          0.01,
          10000
        );


      // ===================================================
      // RENDERER
      // ===================================================

      const renderer =
        new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true
        });

      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio || 1,
          2
        )
      );


      // ===================================================
      // СВЕТ
      // ===================================================

      const hemi =
        new THREE.HemisphereLight(
          0xffffff,
          0x555566,
          2.2
        );

      scene.add(hemi);


      const light =
        new THREE.DirectionalLight(
          0xffffff,
          3
        );

      light.position.set(
        4,
        8,
        6
      );

      scene.add(light);


      // ===================================================
      // RESIZE
      // ===================================================

      function resize() {

        const width =
          canvas.clientWidth;

        const height =
          canvas.clientHeight;

        if (!width || !height)
          return;

        renderer.setSize(
          width,
          height,
          false
        );

        camera.aspect =
          width / height;

        camera.updateProjectionMatrix();
      }


      window.addEventListener(
        'resize',
        resize
      );

      resize();


      // ===================================================
      // ЗАГРУЗКА
      // ===================================================

      status.textContent =
        'Загружаем Аску...';


      const loader =
        new GLTFLoader();


      let model = null;
      let mixer = null;
      let actions = [];
      let currentAction = null;

      let clock =
        new THREE.Clock();


      loader.load(

        url,


        // ================================================
        // УСПЕШНАЯ ЗАГРУЗКА
        // ================================================

        (gltf) => {

          model =
            gltf.scene;

          scene.add(model);


          // ==============================================
          // РАЗМЕР И ЦЕНТРИРОВАНИЕ
          // ==============================================

          const bounds =
            new THREE.Box3()
              .setFromObject(model);

          const size =
            bounds.getSize(
              new THREE.Vector3()
            );

          const center =
            bounds.getCenter(
              new THREE.Vector3()
            );


          const maxDim =
            Math.max(
              size.x,
              size.y,
              size.z
            );


          model.position.sub(
            center
          );


          // ==============================================
          // КАМЕРА
          // ==============================================

          const fov =
            THREE.MathUtils.degToRad(
              camera.fov
            );


          const distance =
            (maxDim / 2) /
            Math.tan(fov / 2) *
            1.5;


          camera.position.set(
            0,
            0,
            distance
          );


          camera.near =
            Math.max(
              maxDim / 1000,
              0.001
            );


          camera.far =
            maxDim * 100;


          camera.lookAt(
            0,
            0,
            0
          );


          camera.updateProjectionMatrix();


          // ==============================================
          // АНИМАЦИИ
          // ==============================================

          if (
            gltf.animations &&
            gltf.animations.length > 0
          ) {

            mixer =
              new THREE.AnimationMixer(
                model
              );


            actions =
              gltf.animations.map(
                (clip) => {

                  console.log(
                    'Найдена анимация:',
                    clip.name,
                    'длительность:',
                    clip.duration
                  );

                  return mixer.clipAction(
                    clip
                  );

                }
              );


            // Первая анимация
            // запускается автоматически

            currentAction =
              actions[0];

            currentAction
              .reset()
              .play();


            status.textContent =
              'Аска загружена! ' +
              'Найдено анимаций: ' +
              gltf.animations.length;

          } else {

            status.textContent =
              'Аска загружена, но ' +
              'в GLB нет встроенных анимаций.';

          }


          console.log(
            'GLTF:',
            gltf
          );

          console.log(
            'Анимации:',
            gltf.animations
          );

        },


        // ================================================
        // ПРОГРЕСС
        // ================================================

        (event) => {

          if (event.total > 0) {

            const percent =
              Math.round(
                event.loaded /
                event.total *
                100
              );


            status.textContent =
              'Загрузка Аски: ' +
              percent +
              '%';

          } else {

            status.textContent =
              'Загружаем Аску... ' +
              (
                event.loaded /
                1048576
              ).toFixed(1) +
              ' МБ';

          }

        },


        // ================================================
        // ОШИБКА
        // ================================================

        (error) => {

          console.error(
            'GLB error:',
            error
          );


          status.textContent =
            'Ошибка загрузки: ' +
            (
              error?.message ||
              String(error)
            );

        }

      );


      // ===================================================
      // КНОПКА PLAY
      // ===================================================

      playButton.onclick =
        () => {

          if (
            actions.length === 0
          ) {

            status.textContent =
              'В этой GLB нет анимаций.';

            return;
          }


          if (
            !currentAction
          ) {

            currentAction =
              actions[0];

          }


          currentAction
            .reset()
            .play();


          status.textContent =
            'Анимация запущена ▶';

        };


      // ===================================================
      // STOP
      // ===================================================

      stopButton.onclick =
        () => {

          if (
            currentAction
          ) {

            currentAction.stop();

          }


          status.textContent =
            'Анимация остановлена ■';

        };


      // ===================================================
      // RESET
      // ===================================================

      resetButton.onclick =
        () => {

          if (
            currentAction
          ) {

            currentAction.stop();

            currentAction.reset();

          }


          status.textContent =
            'Анимация сброшена ↻';

        };


      // ===================================================
      // ОСНОВНОЙ ЦИКЛ
      // ===================================================

      function animate() {

        requestAnimationFrame(
          animate
        );


        const delta =
          clock.getDelta();


        if (mixer) {

          mixer.update(
            delta
          );

        }


        renderer.render(
          scene,
          camera
        );

      }


      animate();


    } catch (error) {

      console.error(
        'Ошибка запуска:',
        error
      );


      status.textContent =
        'Ошибка: ' +
        (
          error?.message ||
          String(error)
        );

    }

  </script>

</body>
</html>
