
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Rem Pet</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #15121c;
      color: white;
      font-family: Arial, sans-serif;
    }

    #scene {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }

    #panel {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 13px;
      border: 1px solid #ffffff25;
      border-radius: 14px;
      background: #191521eF;
      backdrop-filter: blur(8px);
    }

    #title {
      color: #8dcfff;
      font-weight: bold;
      font-size: 20px;
    }

    #status {
      margin-top: 7px;
      color: #e3dce9;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    #buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      padding: 10px 13px;
      border: 0;
      border-radius: 9px;
      background: #397fbd;
      color: white;
      font-size: 14px;
    }

    button.secondary {
      background: #494252;
    }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      color: #e0d9e8;
      text-align: center;
      font-size: 12px;
      text-shadow: 0 1px 4px black;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="panel">
    <div id="title">REM PET 💙</div>
    <div id="status">Подготовка к загрузке Рем...</div>

    <div id="buttons">
      <button id="playButton">▶ Анимация</button>
      <button id="resetButton" class="secondary">Сбросить камеру</button>
    </div>
  </div>

  <canvas id="scene"></canvas>
  <div id="hint">Вращай модель пальцем по экрану</div>

  <script type="module">
    import * as THREE from
      "https://esm.sh/three@0.170.0";

    import { GLTFLoader } from
      "https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

    const MODEL_URL =
      "https://huggingface.co/An9er/asuka-model/resolve/main/chibi_rem_-_confession.glb";

    const canvas = document.getElementById("scene");
    const status = document.getElementById("status");
    const playButton = document.getElementById("playButton");
    const resetButton = document.getElementById("resetButton");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x15121c);

    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.01,
      10000
    );

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 1.5)
    );
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x665577, 2));

    const light1 = new THREE.DirectionalLight(0xffffff, 3);
    light1.position.set(4, 8, 6);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0x82c9ff, 2);
    light2.position.set(-5, 4, -4);
    scene.add(light2);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(100, 64),
      new THREE.MeshStandardMaterial({
        color: 0x24202d,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.02;
    scene.add(floor);

    const characterRoot = new THREE.Group();
    scene.add(characterRoot);

    const clock = new THREE.Clock();

    let model = null;
    let mixer = null;
    let actions = [];
    let activeAction = null;
    let clips = [];
    let originalPosition = new THREE.Vector3();
    let originalCameraPosition = new THREE.Vector3();
    let target = new THREE.Vector3(0, 1, 0);
    let cameraAngle = 0;
    let cameraHeightOffset = 0;
    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    function setStatus(text) {
      status.textContent = text;
    }

    function fitCamera(object) {
      object.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        throw new Error("Не удалось определить размеры модели.");
      }

      // Центрируем модель по горизонтали и ставим на пол.
      const center = box.getCenter(new THREE.Vector3());

      object.position.x -= center.x;
      object.position.z -= center.z;
      object.position.y -= box.min.y;
      object.updateMatrixWorld(true);

      const newBox = new THREE.Box3().setFromObject(object);
      const newSize = newBox.getSize(new THREE.Vector3());
      const height = Math.max(newSize.y, 0.01);
      const newCenter = newBox.getCenter(new THREE.Vector3());

      target.set(0, height * 0.5, 0);

      const distance =
        height / (2 * Math.tan(
          THREE.MathUtils.degToRad(camera.fov / 2)
        ));

      camera.position.set(
        0,
        height * 0.6,
        distance * 1.65
      );

      camera.near = Math.max(height / 1000, 0.001);
      camera.far = Math.max(height * 100, 1000);
      camera.updateProjectionMatrix();
      camera.lookAt(target);

      originalPosition.copy(characterRoot.position);
      originalCameraPosition.copy(camera.position);
    }

    async function loadRem() {
      try {
        setStatus("Подключаюсь к Hugging Face...");

        const response = await fetch(MODEL_URL);

        if (!response.ok) {
          throw new Error(
            "Ошибка HTTP " + response.status +
            ". Проверь имя файла в Hugging Face."
          );
        }

        const buffer = await response.arrayBuffer();

        setStatus(
          "Файл загружен (" +
          (buffer.byteLength / 1024 / 1024).toFixed(1) +
          " МБ). Загружаю 3D-модель..."
        );

        const loader = new GLTFLoader();

        const gltf = await new Promise((resolve, reject) => {
          loader.parse(buffer, "", resolve, reject);
        });

        model = gltf.scene;
        characterRoot.add(model);
        clips = gltf.animations || [];

        model.traverse(object => {
          if (object.isMesh) {
            object.frustumCulled = false;

            if (object.material) {
              const materials = Array.isArray(object.material)
                ? object.material
                : [object.material];

              for (const material of materials) {
                material.needsUpdate = true;
              }
            }
          }
        });

        fitCamera(model);

        if (clips.length > 0) {
          mixer = new THREE.AnimationMixer(model);

          actions = clips.map(clip =>
            mixer.clipAction(clip)
          );

          activeAction = actions[0];
          activeAction.reset();
          activeAction.play();

          playButton.textContent = "▶ Следующая анимация";

          setStatus(
            "Рем загружена! Найдено анимаций: " +
            clips.length + ". Сейчас играет: " + clips[0].name
          );
        } else {
          setStatus(
            "Рем загружена! В GLB нет встроенных анимаций. " +
            "Модель отображается, но для движения нужны анимации."
          );
          playButton.textContent = "Анимаций нет";
        }

        console.log("Rem GLB:", {
          animations: clips.map(c => c.name),
          model: gltf
        });

      } catch (error) {
        console.error(error);

        setStatus(
          "Ошибка загрузки: " +
          (error.message || String(error))
        );
      }
    }

    playButton.addEventListener("click", () => {
      if (!actions.length) {
        setStatus(
          "В этом GLB нет анимаций. Сначала проверим, " +
          "есть ли они в исходной модели."
        );
        return;
      }

      let index = actions.indexOf(activeAction);
      index = (index + 1) % actions.length;

      if (activeAction) {
        activeAction.fadeOut(0.25);
      }

      activeAction = actions[index];
      activeAction.reset().fadeIn(0.25).play();

      setStatus(
        "Анимация " + (index + 1) + " из " +
        actions.length + ": " + clips[index].name
      );
    });

    resetButton.addEventListener("click", () => {
      cameraAngle = 0;
      cameraHeightOffset = 0;
      camera.position.copy(originalCameraPosition);
      camera.lookAt(target);
    });

    canvas.addEventListener("pointerdown", event => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", event => {
      if (!dragging) return;

      const dx = event.clientX - previousX;
      const dy = event.clientY - previousY;

      previousX = event.clientX;
      previousY = event.clientY;

      cameraAngle -= dx * 0.008;
      cameraHeightOffset += dy * 0.006;
      cameraHeightOffset = THREE.MathUtils.clamp(
        cameraHeightOffset, -2, 2
      );

      const offset = originalCameraPosition.clone().sub(target);
      const radius = Math.sqrt(
        offset.x * offset.x + offset.z * offset.z
      );
      const angle = Math.atan2(offset.x, offset.z) + cameraAngle;

      camera.position.x = target.x + Math.sin(angle) * radius;
      camera.position.z = target.z + Math.cos(angle) * radius;
      camera.position.y =
        originalCameraPosition.y + cameraHeightOffset;

      camera.lookAt(target);
    });

    canvas.addEventListener("pointerup", () => {
      dragging = false;
    });

    canvas.addEventListener("pointercancel", () => {
      dragging = false;
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
      );
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight,
      false
    );

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);

      if (mixer) {
        mixer.update(delta);
      }

      renderer.render(scene, camera);
    }

    animate();
    loadRem();
  </script>
</body>
</html>
