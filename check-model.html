
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rem 3D Model Viewer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: system-ui, sans-serif;
    }

    #viewer {
      position: fixed;
      inset: 0;
      background: transparent;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    #status {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 12px;
      border-radius: 10px;
      font: 13px system-ui, sans-serif;
      overflow-wrap: anywhere;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="status">Загружаю Рем…</div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
      premultipliedAlpha: false
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    viewer.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777788, 2.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 3);
    keyLight.position.set(3, 5, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffb9d8, 1.2);
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    let model = null;

    const loader = new GLTFLoader();

    loader.load(
      'https://github.com/netooponyal-spec/AsukaPet/releases/download/Rem-textured1/rem-textured.glb',
      (gltf) => {
        model = gltf.scene;
        scene.add(model);

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        model.position.sub(center);

        const maxDimension = Math.max(size.x, size.y, size.z);

        if (maxDimension > 0) {
          const targetHeight = 2.0;
          model.scale.setScalar(targetHeight / maxDimension);
        }

        const scaledBox = new THREE.Box3().setFromObject(model);
        const scaledSize = scaledBox.getSize(new THREE.Vector3());

        camera.position.set(
          0,
          scaledSize.y * 0.05,
          Math.max(scaledSize.y * 2.2, 3.5)
        );

        camera.lookAt(0, 0, 0);
        camera.near = 0.01;
        camera.far = 1000;
        camera.updateProjectionMatrix();

        status.textContent = 'Рем загружена';
      },
      (event) => {
        if (event.total > 0) {
          const percent = Math.round(event.loaded / event.total * 100);
          status.textContent = `Загружаю Рем: ${percent}%`;
        }
      },
      (error) => {
        console.error(error);
        status.textContent =
          'Ошибка загрузки модели. Проверь ссылку на GLB и интернет.';
      }
    );

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
    }

    window.addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);

      if (model) {
        model.rotation.y += 0.003;
        model.position.y = Math.sin(Date.now() * 0.0015) * 0.035;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
