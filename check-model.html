<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rem Pet — 3D Viewer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    #viewer{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%}
    #status{position:fixed;left:10px;right:10px;bottom:10px;z-index:10;padding:10px 12px;border-radius:10px;background:rgba(20,20,25,.9);color:white;font-family:system-ui,sans-serif;font-size:14px;overflow-wrap:anywhere}
  </style>
</head>
<body>
<div id="viewer"></div>
<div id="status">Запускаю 3D-движок…</div>
<script type="module">
const status=document.getElementById('status');
const viewer=document.getElementById('viewer');
let lastStatus={main:'Запускаю 3D-движок…',detail:''};
function report(main,detail=''){
 lastStatus={main,detail};
 status.textContent=detail?main+'\n'+detail:main;
 try{parent.postMessage('MODEL_STATUS:'+main+'|'+detail,'*')}catch(e){}
}
window.addEventListener('message',e=>{
 if(e.data==='MODEL_STATUS_REQUEST'){
  try{e.source.postMessage('MODEL_STATUS:'+lastStatus.main+'|'+lastStatus.detail,e.origin==='null'?'*':e.origin)}catch(err){try{e.source.postMessage('MODEL_STATUS:'+lastStatus.main+'|'+lastStatus.detail,'*')}catch(ignore){}}
 }
});
async function start(){
 try{
  report('Рэм загружается…','Подключаю Three.js');
  const THREE=await import('https://esm.sh/three@0.170.0');
  const {GLTFLoader}=await import('https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js');
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(35,window.innerWidth/window.innerHeight,.01,100);
  const renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:'high-performance',preserveDrawingBuffer:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setClearColor(0x000000,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.NoToneMapping;
  renderer.toneMappingExposure=1;
  viewer.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x666677,2));
  const keyLight=new THREE.DirectionalLight(0xffffff,3);keyLight.position.set(4,7,6);scene.add(keyLight);
  const fillLight=new THREE.DirectionalLight(0x9fd8ff,1.5);fillLight.position.set(-4,3,-4);scene.add(fillLight);
  const modelURL=new URL('./models/rem-textured.glb',window.location.href).href;
  report('Рэм загружается…','Загружаю 3D-модель');
  const gltf=await new GLTFLoader().loadAsync(modelURL);
  const model=gltf.scene;scene.add(model);
  let meshCount=0;const meshes=[];
  model.traverse(object=>{
   if(!object.isMesh)return;
   meshCount++;
   meshes.push(object);
   object.frustumCulled=false;
   // Keep GLB material and texture settings from the source file.
   // Overriding color space, mipmaps and filters can break embedded textures.
  });
  if(meshCount===0)throw new Error('GLB загружен, но внутри нет 3D-геометрии (Mesh).');
  report('Рэм загружается…','Найдено 3D-объектов: '+meshCount+'. Подгоняю камеру');
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().makeEmpty();
  for(const mesh of meshes){mesh.updateWorldMatrix(true,false);const geometry=mesh.geometry;if(!geometry)continue;if(!geometry.boundingBox)geometry.computeBoundingBox();if(!geometry.boundingBox||geometry.boundingBox.isEmpty())continue;const meshBox=geometry.boundingBox.clone();meshBox.applyMatrix4(mesh.matrixWorld);if(Number.isFinite(meshBox.min.x)&&Number.isFinite(meshBox.min.y)&&Number.isFinite(meshBox.min.z)&&Number.isFinite(meshBox.max.x)&&Number.isFinite(meshBox.max.y)&&Number.isFinite(meshBox.max.z))box.union(meshBox);}
  if(box.isEmpty())throw new Error('Не удалось определить габариты GLB. Mesh: '+meshCount+'.');
  const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());const maxSize=Math.max(size.x,size.y,size.z);
  if(!Number.isFinite(maxSize)||maxSize<=0)throw new Error('Геометрия найдена, но её координаты нулевые.');
  model.position.sub(center);model.scale.setScalar(3/maxSize);
  const finalSize=3;const fov=THREE.MathUtils.degToRad(camera.fov);const distance=(finalSize/2)/Math.tan(fov/2);
  camera.position.set(0,finalSize*.25,distance*1.35);camera.lookAt(0,finalSize*.15,0);
  report('Рэм загружена ✓','3D-модель готова • объектов: '+meshCount);
  setTimeout(()=>{status.style.display='none'},2500);
  window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
  function animate(){requestAnimationFrame(animate);model.rotation.y+=.003;renderer.render(scene,camera)}
  animate();
 }catch(error){console.error('REM MODEL ERROR:',error);report('Ошибка 3D',''+(error&&error.message?error.message:String(error)))}
}
start();
</script>
</body>
</html>
