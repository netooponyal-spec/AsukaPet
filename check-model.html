<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Rem Pet — 3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #viewer {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 10;

      padding: 10px 12px;

      border-radius: 10px;

      background: rgba(20, 20, 25, 0.9);
      color: white;

      font-family: system-ui, sans-serif;
      font-size: 14px;

      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<div id="viewer"></div>

<div id="status">
  Запускаю 3D-движок…
</div>

<script type="module">

const status = document.getElementById("status");
const viewer = document.getElementById("viewer");

async function start() {

  try {

    status.textContent = "Подключаю Three.js…";

    const THREE = await import(
      "https://esm.sh/three@0.170.0"
    );

    const { GLTFLoader } = await import(
      "https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js"
    );


    // --------------------------------------------------
    // SCENE
    // --------------------------------------------------

    const scene = new THREE.Scene();

    scene.background = null;


    // --------------------------------------------------
    // CAMERA
    // --------------------------------------------------

    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.001,
      10000
    );


    // --------------------------------------------------
    // RENDERER
    // --------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setClearColor(0x000000, 0);

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 1.2;

    viewer.appendChild(renderer.domElement);


    // --------------------------------------------------
    // LIGHT
    // --------------------------------------------------

    const hemisphere =
      new THREE.HemisphereLight(
        0xffffff,
        0x666677,
        2
      );

    scene.add(hemisphere);


    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        3
      );

    keyLight.position.set(
      4,
      7,
      6
    );

    scene.add(keyLight);


    const fillLight =
      new THREE.DirectionalLight(
        0x9fd8ff,
        1.5
      );

    fillLight.position.set(
      -4,
      3,
      -4
    );

    scene.add(fillLight);


    // --------------------------------------------------
    // MODEL
    // --------------------------------------------------

    const modelURL =
      new URL(
        "./models/rem-textured.glb",
        window.location.href
      ).href;


    status.textContent =
      "Загружаю модель Рем…";


    const loader =
      new GLTFLoader();


    const gltf =
      await loader.loadAsync(modelURL);


    const model =
      gltf.scene;


    scene.add(model);


    // --------------------------------------------------
    // FIND ALL MESHES
    // --------------------------------------------------

    let meshCount = 0;

    const meshes = [];

    model.traverse(object => {

      if (object.isMesh) {

        meshCount++;

        meshes.push(object);

        object.frustumCulled = false;

      }

    });


    if (meshCount === 0) {

      throw new Error(
        "GLB загружен, но внутри нет 3D-геометрии (Mesh)."
      );

    }


    status.textContent =
      "Найдено 3D-объектов: " +
      meshCount +
      ". Подгоняю камеру…";


    // --------------------------------------------------
    // CALCULATE BOUNDS
    // --------------------------------------------------

    const box =
      new THREE.Box3();


    box.makeEmpty();


    for (const mesh of meshes) {

      mesh.updateWorldMatrix(
        true,
        false
      );

      box.expandByObject(mesh);

    }


    if (box.isEmpty()) {

      throw new Error(
        "Three.js не смог определить размеры геометрии модели."
      );

    }


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    const center =
      box.getCenter(
        new THREE.Vector3()
      );


    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    if (
      !Number.isFinite(maxSize) ||
      maxSize <= 0
    ) {

      throw new Error(
        "Размер модели равен нулю."
      );

    }


    // --------------------------------------------------
    // CENTER MODEL
    // --------------------------------------------------

    model.position.sub(center);


    // --------------------------------------------------
    // SCALE MODEL
    // --------------------------------------------------

    const targetSize = 3;

    model.scale.setScalar(
      targetSize / maxSize
    );


    // --------------------------------------------------
    // CAMERA
    // --------------------------------------------------

    const finalSize =
      targetSize;


    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );


    const distance =
      (finalSize / 2) /
      Math.tan(fov / 2);


    camera.position.set(
      0,
      finalSize * 0.25,
      distance * 1.35
    );


    camera.lookAt(
      0,
      finalSize * 0.15,
      0
    );


    // --------------------------------------------------
    // SUCCESS
    // --------------------------------------------------

    status.textContent =
      "Рем загружена ✓";


    setTimeout(() => {

      status.style.display =
        "none";

    }, 2500);


    // --------------------------------------------------
    // RESIZE
    // --------------------------------------------------

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    // --------------------------------------------------
    // ANIMATION
    // --------------------------------------------------

    function animate() {

      requestAnimationFrame(
        animate
      );

      model.rotation.y += 0.003;

      renderer.render(
        scene,
        camera
      );

    }


    animate();


  } catch (error) {

    console.error(
      "REM MODEL ERROR:",
      error
    );


    status.textContent =
      "Ошибка: " +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      );

  }

}


start();

</script>

</body>
</html>
