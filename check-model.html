
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rem Pet — 3D Viewer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#viewer{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#status{position:fixed;left:10px;bottom:10px;right:10px;padding:10px;border-radius:8px;background:#222;color:#fff;font:14px system-ui;overflow-wrap:anywhere}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="viewer"></div>
<div id="status">Подключаю 3D-движок…</div>

<script type="module">
const status = document.getElementById('status');

async function start() {
  try {
    const THREE = await import('three');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

    status.textContent = 'Загружаю модель Рем…';

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(
      35, innerWidth / innerHeight, 0.01, 1000
    );

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('viewer').appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x888899, 2));

    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(3, 5, 6);
    scene.add(light);

    const url = 'https://github.com/netooponyal-spec/AsukaPet/releases/download/Rem-textured1/rem-textured.glb';
    const gltf = await new GLTFLoader().loadAsync(url);
    const model = gltf.scene;

    scene.add(model);

    const bounds = new THREE.Box3().setFromObject(model);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    model.position.sub(center);

    const maxSize = Math.max(size.x, size.y, size.z);
    if (maxSize > 0) model.scale.setScalar(2 / maxSize);

    camera.position.set(0, 0.2, 5);
    camera.lookAt(0, 0, 0);

    status.textContent = 'Рем загружена';

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      model.rotation.y += 0.003;
      renderer.render(scene, camera);
    }
    animate();

  } catch (error) {
    console.error(error);
    status.textContent = 'Ошибка: ' + (error?.message || String(error));
  }
}

start();
</script>
</body>
</html>
