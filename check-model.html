
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>Rem Pet — 3D Viewer</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

#viewer {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#status {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  background: rgba(25, 25, 25, 0.9);
  color: white;
  font: 14px system-ui, sans-serif;
  overflow-wrap: anywhere;
  z-index: 10;
}

#status:empty {
  display: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="viewer"></div>
<div id="status">Запускаю 3D-движок…</div>

<script type="module">
const status = document.getElementById("status");
const viewer = document.getElementById("viewer");

async function start() {
  try {
    status.textContent = "Подключаю 3D-движок…";

    const THREE = await import("three");
    const { GLTFLoader } =
      await import("three/addons/loaders/GLTFLoader.js");

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;

    viewer.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(
      0xffffff,
      0x777788,
      2.2
    );
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(
      0xffffff,
      3
    );
    keyLight.position.set(3, 5, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(
      0xffb6d9,
      1.2
    );
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    const modelURL = new URL(
      "./models/rem-textured.glb",
      window.location.href
    ).href;

    status.textContent = "Загружаю модель Рем…";

    const loader = new GLTFLoader();
    const gltf = await loader.loadAsync(modelURL);

    const model = gltf.scene;
    scene.add(model);

    model.updateMatrixWorld(true);

    const bounds = new THREE.Box3().setFromObject(model);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    model.position.sub(center);

    const maxSize = Math.max(size.x, size.y, size.z);

    if (maxSize > 0) {
      model.scale.setScalar(2.4 / maxSize);
    }

    model.updateMatrixWorld(true);

    camera.position.set(0, 0.1, 5);
    camera.lookAt(0, 0, 0);

    // Подгоняем камеру под модель
    const scaledSize = maxSize > 0 ? 2.4 : 1;
    const fovRadians = THREE.MathUtils.degToRad(
      camera.fov
    );

    const distance =
      (scaledSize / 2) / Math.tan(fovRadians / 2);

    camera.position.set(0, 0, distance * 1.5);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    status.textContent = "";

    function resize() {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }

    window.addEventListener("resize", resize);

    function animate() {
      requestAnimationFrame(animate);

      model.rotation.y += 0.003;

      renderer.render(scene, camera);
    }

    animate();

  } catch (error) {
    console.error(error);

    status.textContent =
      "Ошибка: " +
      (error && error.message
        ? error.message
        : String(error));
  }
}

start();
</script>
</body>
</html>
