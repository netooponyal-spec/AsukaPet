
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка модели Аски</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #171717;
  color: white;
  font-family: sans-serif;
}
canvas {
  width: 100%;
  height: 65vh;
  display: block;
}
</style>
</head>
<body>
<h2>Проверка 3D-модели Аски</h2>
<p id="status">Загружаем модель...</p>
<canvas id="view"></canvas>

<script type="module">
import * as THREE from
'https://unpkg.com/three@0.170.0/build/three.module.js';
import { GLTFLoader } from
'https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const status = document.getElementById('status');
const canvas = document.getElementById('view');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x292929);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / (window.innerHeight * 0.65), 0.1, 1000
);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight * 0.65);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(3, 5, 4);
scene.add(light);

const url = 'https://github.com/netooponyal-spec/AsukaPet/releases/download/Asuka-model-v1/ip-evangelion__asuka-langley__concept__tpose.glb';

new GLTFLoader().load(
  url,
  (gltf) => {
    scene.add(gltf.scene);
    status.textContent = 'Модель загружена!';
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    gltf.scene.position.sub(center);
    camera.position.set(0, size.y * 0.6, size.y * 2.5);
    camera.lookAt(0, 0, 0);
  },
  (event) => {
    if (event.total) {
      status.textContent =
        'Загрузка: ' +
        Math.round(event.loaded / event.total * 100) + '%';
    }
  },
  (error) => {
    console.error(error);
    status.textContent =
      'Не удалось загрузить модель. Проверь подключение к интернету.';
  }
);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / (window.innerHeight * 0.65);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight * 0.65);
});
</script>
</body>
</html>
