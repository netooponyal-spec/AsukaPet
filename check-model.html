
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка модели Аски</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #171717;
      color: white;
      font-family: sans-serif;
    }

    canvas {
      width: 100%;
      height: 65vh;
      display: block;
    }

    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h2>Проверка 3D-модели Аски</h2>
  <p id="status">Подготовка загрузчика...</p>
  <canvas id="view"></canvas>

  <script type="module">
    import * as THREE from
      'https://esm.sh/three@0.170.0';

    import { GLTFLoader } from
      'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    const status = document.getElementById('status');
    const canvas = document.getElementById('view');

    try {
      status.textContent = 'Инициализация 3D-сцены...';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x292929);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / (window.innerHeight * 0.65),
        0.1,
        1000
      );

      camera.position.set(0, 1.5, 4);

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true
      });

      renderer.setSize(
        window.innerWidth,
        window.innerHeight * 0.65
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );

      scene.add(
        new THREE.HemisphereLight(0xffffff, 0x444444, 2)
      );

      const light = new THREE.DirectionalLight(0xffffff, 3);
      light.position.set(3, 5, 4);
      scene.add(light);

      const url =
        'https://github.com/netooponyal-spec/AsukaPet/releases/download/Asuka-model-v1/ip-evangelion__asuka-langley__concept__tpose.glb';

      status.textContent = 'Загружаем модель Аски...';

      const loader = new GLTFLoader();

      loader.load(
        url,

        (gltf) => {
          const model = gltf.scene;
          scene.add(model);

          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());

          model.position.sub(center);

          const maxDim = Math.max(size.x, size.y, size.z);
          camera.position.set(0, size.y * 0.15, maxDim * 2.5);
          camera.lookAt(0, 0, 0);

          status.textContent = 'Модель Аски загружена!';

          console.log('Модель успешно загружена', gltf);
        },

        (event) => {
          if (event.total > 0) {
            const percent = Math.round(
              event.loaded / event.total * 100
            );

            status.textContent =
              'Загрузка модели: ' + percent + '%';
          } else {
            status.textContent =
              'Загружаем модель... Получено ' +
              Math.round(event.loaded / 1024 / 1024) +
              ' МБ';
          }
        },

        (error) => {
          console.error('Ошибка загрузки модели:', error);

          status.textContent =
            'Не удалось загрузить модель. ' +
            'Возможна проблема с доступом к файлу или сетью.';
        }
      );

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect =
          window.innerWidth / (window.innerHeight * 0.65);

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight * 0.65
        );
      });

    } catch (error) {
      console.error('Ошибка запуска:', error);
      status.textContent =
        'Ошибка запуска: ' + error.message;
    }
  </script>
</body>
</html>
