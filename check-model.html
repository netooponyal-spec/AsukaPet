
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Rem Pet — 3D Viewer</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #panel {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 12px;
      color: white;
      background: rgba(25, 21, 33, 0.88);
    }

    #title {
      font-size: 19px;
      font-weight: bold;
      color: #8dcfff;
    }

    #status {
      margin-top: 7px;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    button {
      margin-top: 10px;
      margin-right: 6px;
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      background: #397fbd;
      color: white;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="panel">
    <div id="title">REM PET 💙</div>
    <div id="status">Подключаю 3D-движок…</div>
    <button id="rotateButton">Вращение: включено</button>
    <button id="resetButton">Сбросить камеру</button>
  </div>

  <canvas id="scene"></canvas>

  <script type="module">
    const status = document.getElementById("status");
    const canvas = document.getElementById("scene");
    const rotateButton = document.getElementById("rotateButton");
    const resetButton = document.getElementById("resetButton");

    async function start() {
      try {
        status.textContent = "Загружаю 3D-движок…";

        const THREE = await import(
          "https://esm.sh/three@0.170.0"
        );

        const { GLTFLoader } = await import(
          "https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js"
        );

        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(
          35,
          window.innerWidth / window.innerHeight,
          0.01,
          10000
        );

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: true
        });

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio || 1, 1.5)
        );

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        scene.add(
          new THREE.HemisphereLight(0xffffff, 0x665577, 2)
        );

        const light1 = new THREE.DirectionalLight(0xffffff, 3);
        light1.position.set(4, 8, 6);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0x82c9ff, 2);
        light2.position.set(-5, 4, -4);
        scene.add(light2);

        // Модель лежит в папке models на этом же сайте.
        const modelURL = new URL(
          "./models/rem-textured.glb",
          window.location.href
        ).href;

        status.textContent = "Загружаю модель Рем с GitHub Pages…";

        const loader = new GLTFLoader();
        const gltf = await loader.loadAsync(modelURL);

        const model = gltf.scene;
        scene.add(model);

        model.updateMatrixWorld(true);

        const bounds = new THREE.Box3().setFromObject(model);
        const size = bounds.getSize(new THREE.Vector3());
        const center = bounds.getCenter(new THREE.Vector3());

        if (!Number.isFinite(size.y) || size.y <= 0) {
          throw new Error("У модели не удалось определить размеры.");
        }

        model.position.x -= center.x;
        model.position.y -= bounds.min.y;
        model.position.z -= center.z;

        const height = size.y;
        const target = new THREE.Vector3(0, height / 2, 0);

        const initialDistance =
          (height / 2) /
          Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

        let distance = initialDistance * 1.8;
        let angle = 0;
        let autoRotate = true;
        let dragging = false;
        let previousX = 0;

        function updateCamera() {
          camera.position.set(
            Math.sin(angle) * distance,
            height * 0.6,
            Math.cos(angle) * distance
          );
          camera.lookAt(target);
        }

        updateCamera();

        rotateButton.addEventListener("click", () => {
          autoRotate = !autoRotate;
          rotateButton.textContent = autoRotate
            ? "Вращение: включено"
            : "Вращение: выключено";
        });

        resetButton.addEventListener("click", () => {
          angle = 0;
          distance = initialDistance * 1.8;
          updateCamera();
        });

        canvas.addEventListener("pointerdown", event => {
          dragging = true;
          previousX = event.clientX;
          canvas.setPointerCapture(event.pointerId);
        });

        canvas.addEventListener("pointermove", event => {
          if (!dragging) return;

          angle += (event.clientX - previousX) * 0.008;
          previousX = event.clientX;

          updateCamera();
        });

        canvas.addEventListener("pointerup", () => {
          dragging = false;
        });

        canvas.addEventListener("pointercancel", () => {
          dragging = false;
        });

        window.addEventListener("resize", () => {
          camera.aspect =
            window.innerWidth / window.innerHeight;

          camera.updateProjectionMatrix();

          renderer.setSize(
            window.innerWidth,
            window.innerHeight
          );
        });

        status.textContent =
          "Рем загружена! Анимаций в модели: " +
          (gltf.animations?.length || 0);

        function animate() {
          requestAnimationFrame(animate);

          if (autoRotate && !dragging) {
            angle += 0.003;
            updateCamera();
          }

          renderer.render(scene, camera);
        }

        animate();

      } catch (error) {
        console.error(error);
        status.textContent =
          "Ошибка: " + (error.message || String(error));
      }
    }

    start();
  </script>
</body>
</html>
