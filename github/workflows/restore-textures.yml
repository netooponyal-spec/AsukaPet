
name: Restore Rem Textures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Download original GLB
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/netooponyal-spec/AsukaPet/releases/download/Ram/rem.glb" \
            -o rem.glb

      - name: Attach character color texture
        run: |
          npm init -y
          npm install @gltf-transform/core

          cat > restore.mjs <<'EOF'
          import fs from 'node:fs';
          import { NodeIO } from '@gltf-transform/core';

          const io = new NodeIO();
          const doc = await io.read('rem.glb');
          const root = doc.getRoot();

          const image = fs.readFileSync('Rem_ALBShadowAlt.png');

          const texture = doc.createTexture('Rem_ALBShadowAlt')
            .setImage(image)
            .setMimeType('image/png');

          let count = 0;

          for (const material of root.listMaterials()) {
            const name = material.getName().toLowerCase();

            console.log('Material:', material.getName());

            if (name.includes('rem') && !name.includes('outline')) {
              material
                .setBaseColorTexture(texture)
                .setBaseColorFactor([1, 1, 1, 1]);

              count++;
              console.log('Texture attached:', material.getName());
            }
          }

          if (count === 0) {
            throw new Error(
              'No matching Rem material found. Check the material names above.'
            );
          }

          await io.write('rem-textured.glb', doc);
          console.log('Created rem-textured.glb');
          EOF

          node restore.mjs

      - name: Upload textured model
        uses: actions/upload-artifact@v4
        with:
          name: rem-textured
          path: rem-textured.glb
          compression-level: 0
          
